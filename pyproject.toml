[project]
name = "footnote"
version = "0.1.0"
description = "Ask the GDPR and the EU AI Act a question. Get the article quoted, or an honest refusal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "lxml>=5.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
local = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
footnote = "footnote.cli:app"
footnote-mcp = "footnote.mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["footnote*"]

[tool.pytest.ini_options]
pythonpath = ["."]
