name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[api,mcp,dev]"
      # corpus comes from the public Publications Office API - no key needed
      - run: python -c "from footnote.corpus.fetch import fetch_instrument; fetch_instrument('gdpr'); fetch_instrument('ai_act')"
      - run: pytest -q
